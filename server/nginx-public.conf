# Public, read-only copy of the GUI for exposing through a Cloudflare Tunnel.
# See "Public view-only portal" in server/README.md.
#
# This is a whole site file, not a snippet: the cache, maps, rate-limit zones
# and log format have to live at http level, which is where files in
# sites-enabled/ get included.
#
#   sudo mkdir -p /var/cache/nginx
#   sudo cp server/nginx-public.conf /etc/nginx/sites-available/funplaneviewer-public
#   sudo ln -s /etc/nginx/sites-available/funplaneviewer-public /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Security model: everything is an allowlist. The only things reachable are
# the page, its icon, and the GET endpoints the GUI reads. Writes, the
# sidecar's snapshots/history/self-update, SkyStats' settings endpoint and
# every other path answer 404 or 405 whatever the page does, so hiding the
# edit buttons in public mode is cosmetic and this file is the actual lock.
#
# It listens on localhost only, so cloudflared is the only way in. If
# SkyStats runs on a different box than this nginx, replace 127.0.0.1:5173
# below with the feeder's IP (not a .local name).

proxy_cache_path /var/cache/nginx/fpv-public levels=1:2 keys_zone=fpv_public:1m
                 max_size=50m inactive=10m use_temp_path=off;

# The visitor's real address. cloudflared connects from localhost, so
# $remote_addr is always 127.0.0.1; Cloudflare puts the client in
# CF-Connecting-IP and overwrites any value a client sends. Only local
# processes can reach this port, so the header can't be forged from outside.
map $http_cf_connecting_ip $fpv_client {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# Per-visitor limits. A page load is ~10 requests and the Stats tab ~8 more,
# all at once, then 4 every minute while it's open; this leaves plenty of
# room for a person and stops a script hammering the Pi.
limit_req_zone  $fpv_client zone=fpv_public_req:10m rate=5r/s;
limit_conn_zone $fpv_client zone=fpv_public_conn:10m;

# Only the page itself carries the cookie that switches index.html into
# public mode; nginx drops the header entirely where this is empty.
map $uri $fpv_public_cookie {
    /           "fpv_mode=public; Path=/; SameSite=Lax";
    /index.html "fpv_mode=public; Path=/; SameSite=Lax";
    default     "";
}

log_format fpv_public '$fpv_client [$time_local] "$request" $status $body_bytes_sent '
                      'cache=$upstream_cache_status "$http_user_agent"';

server {
    listen 127.0.0.1:8088;
    server_name _;
    root /opt/funplaneviewer;
    server_tokens off;

    access_log /var/log/nginx/fpv-public.access.log fpv_public;
    error_log  /var/log/nginx/fpv-public.error.log warn;

    # Nothing here takes a body or needs a slow client.
    client_max_body_size        1k;
    client_body_timeout         10s;
    client_header_timeout       10s;
    large_client_header_buffers 4 8k;
    keepalive_timeout           30s;
    send_timeout                30s;

    limit_req  zone=fpv_public_req burst=60 nodelay;
    limit_conn fpv_public_conn 20;
    limit_req_status  429;
    limit_conn_status 429;

    # Read-only: nothing on this site accepts a write.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    gzip on;
    gzip_types application/json application/javascript text/csv text/plain image/svg+xml;

    # Response headers. Every one is set here and no location sets its own,
    # because a location with any add_header silently drops all of these.
    #
    # CSP: the page is one file with inline script and style and no external
    # code, so script/style must allow 'unsafe-inline'. What this buys is
    # containment. Nothing can be loaded from elsewhere, data can only be
    # fetched from this origin, and it can't be framed, have its base URL
    # rewritten, or post a form. Photos are hotlinked from anywhere, so
    # images are any https URL.
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options      "nosniff" always;
    add_header X-Frame-Options             "DENY" always;
    # Photo hosts and airplanes.live don't learn this portal's address.
    add_header Referrer-Policy             "no-referrer" always;
    add_header Permissions-Policy          "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy  "same-origin" always;
    # Other sites can't embed the feeds or use this Pi as their API.
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Browsers only honour this over HTTPS, which Cloudflare terminates.
    add_header Strict-Transport-Security   "max-age=31536000" always;
    add_header X-Robots-Tag                "noindex, nofollow, noarchive" always;
    add_header Cache-Control               "no-cache" always;
    add_header Set-Cookie                  $fpv_public_cookie always;
    add_header X-Cache-Status              $upstream_cache_status always;

    # Upstream handling, inherited by the proxied locations below.
    #
    # Every visitor shares one upstream fetch per endpoint per 30s. The key
    # is the bare path and the query string is never forwarded, so neither
    # the GUI's ?_=<timestamp> cache-buster nor anything a visitor appends
    # reaches SkyStats or can bypass the cache.
    proxy_cache fpv_public;
    proxy_cache_key $uri;
    proxy_cache_valid 200 30s;
    proxy_cache_valid any 5s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_http_version 1.1;

    # Strip everything a visitor could use to shape what gets cached: no
    # compression variants, no partial responses, no credentials.
    proxy_pass_request_body off;
    proxy_set_header Content-Length  "";
    proxy_set_header Connection      "";
    proxy_set_header Accept-Encoding "";
    proxy_set_header Range           "";
    proxy_set_header If-Range        "";
    proxy_set_header Cookie          "";
    proxy_set_header Authorization   "";

    # Upstreams are trusted, but never let a response steer nginx (internal
    # redirects to arbitrary files via X-Accel-Redirect, cache overrides).
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary
                         X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate
                         X-Accel-Buffering X-Accel-Charset;
    # Both upstreams send wide-open CORS advertising POST/PUT/DELETE; this
    # page is same-origin and needs none of it.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Set-Cookie;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Pragma;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html { }

    location = /favicon.svg { }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # SkyStats: exactly the feeds the GUI reads (API / statsEndpoints() in
    # index.html). Its settings endpoint and anything else stay unreachable.
    # $uri here can only be one of the paths the regex spells out.
    location ~ ^/api/stats/(interesting/(military|government|civilian|police)|seen/totals|types/(flights|aircraft)/(day|month|year|all)|routes/(airlines|airports-domestic|airports-international|routes|countries-origin|countries-destination))$ {
        proxy_pass http://127.0.0.1:5173$uri;
    }

    # Sidecar: the two files the GUI loads at startup. Snapshots, history,
    # self-update and every POST/DELETE route fall through to the 404 below.
    location = /api/uploads/images.csv {
        proxy_pass http://127.0.0.1:5174$uri;
    }

    location = /api/uploads/backup.json {
        proxy_pass http://127.0.0.1:5174$uri;
    }

    location / {
        return 404;
    }
}
